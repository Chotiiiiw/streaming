services:
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init

    depends_on:
      - kafka

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list > /dev/null 2>&1
        do
          sleep 2
        done

        echo "Kafka is ready. Creating topics..."

        for topic in \
          transactions_raw \
          clean_transactions \
          fraud_alerts \
          transactions_dlq
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done

        echo "Topic initialization complete."

  kafka:
    image: apache/kafka:latest
    container_name: f-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs


  jobmanager:
    image: flink:2.2
    container_name: flink-jobmanager

    ports:
      - "8081:8081"

    command: jobmanager

    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:ro
      - ./flink/sql:/opt/flink/sql:ro
      - ./flink-app/target:/opt/flink/usrlib:ro


  taskmanager:
    image: flink:2.2
    container_name: flink-taskmanager

    depends_on:
      - jobmanager

    command: taskmanager

    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:ro
